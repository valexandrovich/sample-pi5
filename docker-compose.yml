services:
  backend:
    build: ./backend
    environment:
      - PORT=3000
    expose:
      - "3000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        - APP_PATH=${APP_PATH:-sample}
    environment:
      - APP_PATH=${APP_PATH:-sample}
    ports:
      - "${APP_PORT:-3115}:80"
    depends_on:
      - backend
    restart: unless-stopped
