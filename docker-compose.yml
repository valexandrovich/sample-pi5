services:
  backend:
    build: ./backend
    environment:
      - PORT=3000
    expose:
      - "3000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        - VITE_BASE_PATH=/app1/
        - VITE_API_URL=/app1/api
    ports:
      - "${APP_PORT:-8080}:80"
    depends_on:
      - backend
    restart: unless-stopped

